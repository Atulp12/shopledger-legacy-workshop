<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">A diagram of the existing ShopLedger UI, server, route files, library modules, configuration, JSON data file, and the flow for placing an order.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="orderArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#b91c1c"/></marker>
    <style>
      .bg { fill:#f8fafc; }
      .group { fill:#ffffff; stroke:#cbd5e1; stroke-width:2; rx:14; }
      .server { fill:#e0f2fe; stroke:#0284c7; stroke-width:2; rx:10; }
      .ui { fill:#ede9fe; stroke:#7c3aed; stroke-width:2; rx:10; }
      .route { fill:#ecfccb; stroke:#65a30d; stroke-width:2; rx:8; }
      .lib { fill:#fff7ed; stroke:#ea580c; stroke-width:2; rx:8; }
      .config { fill:#fef3c7; stroke:#d97706; stroke-width:2; rx:8; }
      .data { fill:#fee2e2; stroke:#dc2626; stroke-width:2; rx:8; }
      .heading { font: 700 24px Arial, sans-serif; fill:#0f172a; }
      .subheading { font: 700 17px Arial, sans-serif; fill:#334155; }
      .node { font: 600 16px Arial, sans-serif; fill:#172033; }
      .small { font: 14px Arial, sans-serif; fill:#475569; }
      .line { stroke:#64748b; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .order { stroke:#b91c1c; stroke-width:4; fill:none; stroke-dasharray:10 6; marker-end:url(#orderArrow); }
      .orderlabel { font:700 14px Arial, sans-serif; fill:#991b1b; }
      .legend { font: 14px Arial, sans-serif; fill:#334155; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1120"/>
  <text x="48" y="45" class="heading">ShopLedger: existing architecture and order placement flow</text>
  <text x="48" y="70" class="small">Solid arrows show module dependencies/data access. Dashed red arrows show the order-placement path.</text>

  <rect class="group" x="40" y="105" width="270" height="270"/>
  <text x="62" y="138" class="subheading">Browser / UI</text>
  <rect class="ui" x="65" y="165" width="220" height="72"/>
  <text x="84" y="195" class="node">public/index.html</text>
  <text x="84" y="217" class="small">POS, order desk, reports</text>
  <rect class="ui" x="65" y="265" width="220" height="72"/>
  <text x="84" y="295" class="node">public/js/app.js</text>
  <text x="84" y="317" class="small">XHR GET/POST to /api</text>

  <rect class="group" x="360" y="105" width="285" height="270"/>
  <text x="382" y="138" class="subheading">Application</text>
  <rect class="server" x="385" y="165" width="235" height="72"/>
  <text x="405" y="195" class="node">server.js</text>
  <text x="405" y="217" class="small">Express, JSON parser, static UI</text>
  <rect class="server" x="385" y="265" width="235" height="72"/>
  <text x="405" y="295" class="node">/orders/:id/invoice</text>
  <text x="405" y="317" class="small">printable HTML invoice</text>

  <rect class="group" x="695" y="105" width="400" height="470"/>
  <text x="717" y="138" class="subheading">routes/</text>
  <rect class="route" x="720" y="165" width="160" height="75"/>
  <text x="740" y="195" class="node">products.js</text>
  <text x="740" y="217" class="small">products, coupons</text>
  <rect class="route" x="900" y="165" width="160" height="75"/>
  <text x="920" y="195" class="node">orders.js</text>
  <text x="920" y="217" class="small">orders, cancel</text>
  <rect class="route" x="720" y="270" width="160" height="75"/>
  <text x="740" y="300" class="node">customers.js</text>
  <text x="740" y="322" class="small">customers, settle</text>
  <rect class="route" x="900" y="270" width="160" height="75"/>
  <text x="920" y="300" class="node">reports.js</text>
  <text x="920" y="322" class="small">dashboard, GST, export</text>
  <text x="720" y="390" class="small">Mounted by server.js at /api</text>
  <text x="720" y="418" class="small">POST /api/orders is the order endpoint</text>
  <text x="720" y="446" class="small">GET /api/products and POST /api/pricing/preview</text>
  <text x="720" y="474" class="small">support the POS order screen</text>

  <rect class="group" x="1145" y="105" width="410" height="800"/>
  <text x="1167" y="138" class="subheading">lib/</text>
  <rect class="lib" x="1170" y="165" width="160" height="62"/><text x="1190" y="202" class="node">store.js</text>
  <rect class="lib" x="1350" y="165" width="160" height="62"/><text x="1370" y="202" class="node">orders.js</text>
  <rect class="lib" x="1170" y="247" width="160" height="62"/><text x="1190" y="284" class="node">inventory.js</text>
  <rect class="lib" x="1350" y="247" width="160" height="62"/><text x="1370" y="284" class="node">pricing.js</text>
  <rect class="lib" x="1170" y="329" width="160" height="62"/><text x="1190" y="366" class="node">coupons.js</text>
  <rect class="lib" x="1350" y="329" width="160" height="62"/><text x="1370" y="366" class="node">tax.js</text>
  <rect class="lib" x="1170" y="411" width="160" height="62"/><text x="1190" y="448" class="node">ledger.js</text>
  <rect class="lib" x="1350" y="411" width="160" height="62"/><text x="1370" y="448" class="node">reports.js</text>
  <rect class="lib" x="1170" y="493" width="160" height="62"/><text x="1190" y="530" class="node">invoice.js</text>
  <rect class="lib" x="1350" y="493" width="160" height="62"/><text x="1370" y="530" class="node">dates.js</text>
  <text x="1170" y="595" class="small">Business rules, calculations,</text>
  <text x="1170" y="617" class="small">persistence, reports, and invoices</text>

  <rect class="config" x="360" y="450" width="285" height="86"/>
  <text x="385" y="483" class="node">config.js</text>
  <text x="385" y="507" class="small">shop, GST slabs, coupons, port</text>

  <rect class="data" x="695" y="650" width="400" height="105"/>
  <text x="720" y="689" class="node">data/db.json</text>
  <text x="720" y="715" class="small">products · orders · customers · settlements</text>
  <text x="720" y="737" class="small">audit log · next IDs</text>

  <!-- General dependencies -->
  <path class="line" d="M285 300 H345 Q360 300 385 300"/>
  <path class="line" d="M620 200 H700"/>
  <path class="line" d="M620 300 H700"/>
  <path class="line" d="M1000 240 V620 H895 V650"/>
  <path class="line" d="M1250 227 V635 H985 V650"/>
  <path class="line" d="M645 493 H1145"/>
  <path class="line" d="M1330 360 H1350"/>
  <path class="line" d="M1430 391 V411"/>
  <path class="line" d="M1430 473 V493"/>
  <path class="line" d="M1250 473 V493"/>

  <!-- Order flow -->
  <path class="order" d="M285 300 H510 V375 H980 V240"/>
  <text x="495" y="365" class="orderlabel">1. POST /api/orders</text>
  <path class="order" d="M980 240 V600 H1430 V309"/>
  <text x="1000" y="585" class="orderlabel">2. resolve products, check stock, calculate totals</text>
  <path class="order" d="M1430 309 V620 H895 V650"/>
  <text x="1020" y="640" class="orderlabel">3. reserve stock, add order/audit, write JSON</text>
  <path class="order" d="M895 755 V825 H175 V337"/>
  <text x="405" y="815" class="orderlabel">4. 201 Created; UI refreshes catalog, dashboard, customers</text>

  <rect x="45" y="965" width="1505" height="105" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10"/>
  <text x="68" y="998" class="subheading">Order-placement details</text>
  <text x="68" y="1024" class="legend">orders.js reads db.json through store.js; inventory.js validates and deducts stock; pricing.js calls coupons.js and tax.js; ledger.js runs for khata payments; orders.js creates the record; store.js overwrites db.json.</text>
  <text x="68" y="1051" class="legend">server.js also serves an invoice through lib/invoice.js. config.js is used by tax.js, coupons.js, invoice.js, reports.js, and server.js.</text>
</svg>
